  - id: task-setup-guide
    title: "Write Google Sheets webhook setup guide"
    description: >
      Write a step-by-step markdown guide for the user to set up the Google
      Sheets webhook. The guide must cover: (1) creating a Google Sheet,
      (2) opening Extensions → Apps Script, (3) pasting a provided doPost(e)
      function that parses JSON and appends a row, (4) deploying as a web app
      (Execute as "Me", Access "Anyone"), (5) copying the resulting webhook URL.
      Include the full Apps Script code inside the guide with comments.
      Add a "Verify your setup" section with a curl command or test POST
      snippet the user can run.
    wave: 1
    agent: gem-documentation-writer
    prototype: false
    priority: high
    status: pending
    covers:
      - google-sheets-webhook
      - setup-guide
    dependencies: []
    conflicts_with: []
    context_files:
      - path: src/components/Contact.tsx
        description: "Will reference the webhook URL constant; the guide should name the same constant and tell the user where to paste the URL."
      - path: src/pages/contact.tsx
        description: "The page that will render the Contact form; guide should note which page uses the webhook."
    estimated_effort: small
    flags:
      flaky: false
      retries_used: 0
      requires_design_validation: false
    acceptance_criteria:
      - "Guide includes step-by-step numbered instructions for creating a Google Sheet."
      - "Guide includes the complete Apps Script doPost(e) function with inline comments."
      - "Guide explains how to deploy as a web app: Execute as 'Me', Access 'Anyone'."
      - "Guide tells the user exactly where to copy the webhook URL and paste it in the codebase."
      - "Guide includes a verification step (curl or similar) to test the webhook."
      - "Apps Script code correctly parses JSON body and appends a row with timestamp, name, email, category, appVersion, message."
    success_criteria:
      - "A user following the guide can successfully set up the webhook and submit a test form entry without external help."
    failure_modes:
      - scenario: "Apps Script code has a syntax error or incorrect property access."
        likelihood: low
        impact: medium
        mitigation: "Test the Apps Script code in the Google Apps Script editor before finalizing the guide."
      - scenario: "Guide assumes knowledge the user doesn't have (e.g., 'open the Apps Script editor')."
        likelihood: medium
        impact: low
        mitigation: "Use explicit UI labels and navigation paths. Add screenshots if possible (or text descriptions of what to click)."
    task_type: documentation
