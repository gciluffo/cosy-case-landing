pre_mortem:
  overall_risk_level: low
  critical_failure_modes:
    - scenario: "Google Sheets webhook URL is not configured by the user, causing all form submissions to fail silently."
      likelihood: high
      impact: high
      mitigation: >
        Include a prominent placeholder comment at the webhook URL constant.
        Show a clear error toast/message when fetch fails, with a hint to check
        the webhook URL. In the setup guide, add a "Verify your setup" step
        where the user tests a submission.
    - scenario: "Navbar active-state logic for /contact page is incorrect, showing the wrong link as active."
      likelihood: low
      impact: medium
      mitigation: >
        Follow the exact same pattern as the FAQ link: use useRouter().pathname
        and compare against "/contact". Test on both / and /contact routes.
    - scenario: "Form validation allows empty required fields to be submitted."
      likelihood: low
      impact: medium
      mitigation: >
        Implement validation as a pure function run before fetch. Test all
        edge cases: empty strings, whitespace-only, missing keys.
    - scenario: "Mobile layout of the Contact form is cramped or breaks on small screens."
      likelihood: medium
      impact: low
      mitigation: >
        Use responsive Tailwind classes (sm:, md:) for form layout.
        Single-column on mobile, two-column where appropriate on desktop.
        Test at 375px viewport width.
  assumptions:
    - "The user will create a Google Sheet and deploy the Apps Script webhook before the form goes live."
    - "The Google Sheets webhook accepts JSON POST bodies with the field structure defined below."
    - "No CORS issues with Google Apps Script webhooks (they typically allow cross-origin POST)."
    - "The Contact page does not need structured data (no ContactPage schema required for a small landing page)."
    - "The Navbar link order should be: FAQ → Contact → Featured Shelves (Contact between FAQ and content links)."

