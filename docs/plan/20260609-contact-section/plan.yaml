  # ─────────────────────────────────────────────────────────────────────────
  # TASK 2: Create Contact Form Component
  # ─────────────────────────────────────────────────────────────────────────
  - id: task-contact-component
    title: "Create src/components/Contact.tsx form component"
    description: >
      Build the Contact.tsx component with two clearly separated sections:

      **Section 1 — Form:**
      Fields: Name (optional, text), Email (optional, email), Category (required,
      <select> with options: "Bug Report", "Feature Request", "Sync Issue",
      "Other"), App Version (optional, text), Message (required, <textarea>).
      Client-side validation: Category and Message must be non-empty; Email must
      be valid if provided. On submit: POST a JSON body to the Google Sheets
      webhook URL (stored as a constant `WEBHOOK_URL` at the top of the file with
      a placeholder value and a comment telling the user to replace it after
      deploying the Apps Script). Show loading state on the submit button, success
      state (checkmark + message), and error state (message + retry prompt).
      Reset form on success.

      **Section 2 — Email fallback:**
      A clearly separated area (divider line + heading) below the form with a
      mailto link. Text: something like "Prefer to email us directly? Send us a
      message at hello@cosycases.com" with the email as a clickable mailto link.

      **Design system compliance (NON-NEGOTIABLE):**
      - Background: surface-0 (rgb(252 250 246))
      - Input backgrounds: surface-50 (rgb(244 242 238))
      - Input borders: surface-100 (rgb(219 218 215)) default, orange on focus
      - Focus ring: ring-2 ring-orange/50
      - Button: bg-orange, text-white, rounded-full, px-6 py-3, hover:bg-[rgb(190_100_30)]
      - Labels: text-text-secondary, text-sm font-medium
      - Heading: font-heading (Playfair Display), text-3xl sm:text-4xl font-bold
      - Section label: text-xs font-semibold tracking-widest text-orange uppercase
      - NO pure white, NO amber as action, NO border-l-4
      - Form layout: single column on mobile, max-w-2xl centered on desktop
      - Required field indicator: "Required" text or asterisk in text-text-muted
    wave: 1
    agent: gem-implementer
    prototype: false
    priority: high
    status: pending
    covers:
      - contact-form
      - google-sheets-webhook-submission
      - email-fallback
      - client-side-validation
    dependencies: []
    conflicts_with: []
    context_files:
      - path: src/styles/globals.css
        description: "@theme tokens for colors, fonts, etc."
      - path: DESIGN.md
        description: "Full design system — absolute bans, color rules, typography, active states"
      - path: src/components/FAQ.tsx
        description: "Reference for section structure pattern (section label, heading, container)"
      - path: src/components/Navbar.tsx
        description: "Reference for active-state pattern and orange hover styles"
    estimated_effort: large
    flags:
      flaky: false
      retries_used: 0
      requires_design_validation: true
    acceptance_criteria:
      - "Form renders all five fields: Name, Email, Category (select), App Version, Message (textarea)."
      - "Category is a <select> with exactly four options: Bug Report, Feature Request, Sync Issue, Other."
      - "Category and Message are validated as required; Email is validated if non-empty."
      - "Submit button shows loading state (spinner or disabled text) during fetch."
      - "On successful POST: success message shown, form resets."
      - "On fetch failure: error message shown with retry prompt."
      - "Email fallback section is clearly separated from the form with a visual divider."
      - "Mailto link uses hello@cosycases.com with a proper mailto: href."
      - "WEBHOOK_URL constant is declared at the top of the file with a placeholder and clear replacement comment."
      - "All design system bans are respected: no pure white, no amber as action, no border-l-4."
      - "Focus rings use orange. Input backgrounds use surface-50."
      - "Component is responsive: single column on mobile, appropriately sized on desktop (max-w-2xl)."
      - "Component is exported as default function."
    success_criteria:
      - "Form validates correctly: empty required fields are blocked, invalid emails blocked when provided."
      - "POST request is sent with correct JSON structure matching the Apps Script expectations."
      - "All three states (loading, success, error) render correctly and are user-visible."
      - "Component passes TypeScript compilation with no errors."
      - "Component follows all design system rules as verified by manual review against DESIGN.md."
